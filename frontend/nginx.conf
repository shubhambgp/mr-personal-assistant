server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    gzip on;
    # text/event-stream is deliberately NOT here — gzip buffers, which would
    # defeat SSE streaming.
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Big enough for the 20 MB document upload plus multipart overhead. Without
    # this, nginx's 1 MB default rejects uploads with a 413 that never reaches
    # FastAPI, silently breaking the upload feature in the recommended deploy.
    client_max_body_size 25m;

    # Security headers applied to every response. No CSP here yet: the app is a
    # single self-hosted bundle, but a real policy belongs in a later hardening
    # pass once inline styles/scripts are audited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients on a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: without these three the stream is buffered and the whole point
        # of streaming is lost. read_timeout is generous so a long turn (or an
        # idle approval pause) is not severed mid-stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
